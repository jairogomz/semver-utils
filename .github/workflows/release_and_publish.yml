name: Release and publish library

## Temporarily disabled to manage it via AzDevops
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Verify GitHub identity
        run: |
          git remote -v
          curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # setup-node v6 enables npm cache automatically from packageManager in package.json.
          registry-url: https://npm.pkg.github.com
          scope: ${{ vars.NPM_SCOPE }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Release
        run: |
          git config user.name "${{ secrets.GIT_USER_NAME }}"
          git config user.email "${{ secrets.GIT_USER_EMAIL }}"
          pnpm exec release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Configure npm registry
        run: |
          echo "${{ vars.NPM_SCOPE }}:registry=https://npm.pkg.github.com/" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> ~/.npmrc

      - name: Publish package
        run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
